name: Daily Morning Weather Notification

on:
  schedule:
    # Run daily at 01:30 UTC (07:00 IST)
    - cron: "30 1 * * *"
  # Allow manual triggering via GitHub Actions UI / API
  workflow_dispatch:

jobs:
  weather:
    name: Fetch Weather & Push Alert
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weather Monitor
        env:
          NTFY_WEATHER_SECRET_LINK: ${{ secrets.NTFY_WEATHER_SECRET_LINK }}
          NTFY_UPTIME_SECRET_LINK: ${{ secrets.NTFY_UPTIME_SECRET_LINK }}
          WEATHER_LATITUDE: ${{ vars.WEATHER_LATITUDE }}
          WEATHER_LONGITUDE: ${{ vars.WEATHER_LONGITUDE }}
          WEATHER_CITY_NAME: ${{ vars.WEATHER_CITY_NAME }}
        run: |
          python scripts/weather_monitor.py
