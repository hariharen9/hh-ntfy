name: CrackWatch Denuvo Tracker

on:
  schedule:
    # Run every 5 minutes
    - cron: "*/5 * * * *"
  # Allow manual triggering via GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    name: Run Monitor & Push Alert
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Denuvo Release Tracker
        env:
          NTFY_CW_DENUVO_SECRET_LINK: ${{ secrets.NTFY_CW_DENUVO_SECRET_LINK }}
        run: |
          python scripts/crackwatch_denuvo.py

      - name: Commit State Cache Changes
        run: |
          # Check if there are changes in the state file
          if git status --porcelain data/crackwatch_seen.txt | grep -q 'M'; then
            print "State cache changed. Committing updates back to repo..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/crackwatch_seen.txt
            git commit -m "chore: update crackwatch seen posts cache [skip ci]"
            git push
          else
            echo "No state cache changes detected. Skipping git commit."
          fi
